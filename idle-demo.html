<h1>放置玩法演示存档</h1>
<p class="note">临时页面，只在开发服务器上。载入会覆盖<b>这个地址</b>下的存档，然后打开游戏。请先关掉其他打开着游戏的标签页。</p>
<div class="card">
  <h2>A · 离开 3 小时后回来</h2>
  <ul>
    <li>回来弹窗：收银台、加盟店收入、做好的外送订单、猫咪礼物</li>
    <li>窗台上有猫咪礼物，点一下捡起来</li>
    <li>玻璃花房装修中（往右再往上走），露天庭院已预约</li>
    <li>主店墙上挂着连锁地图；"升级"页有收银台、订单、连锁天赋</li>
  </ul>
  <button data-demo="return">载入并打开游戏</button>
</div>
<div class="card">
  <h2>B · 整栋楼已完工，可以开分店</h2>
  <ul>
    <li>"升级 → 连锁分店"：交出后的收入、五地版图、连锁天赋（12 颗星）</li>
    <li>点"开新分店"：地图上的五家店面、地点加成、确认弹窗</li>
  </ul>
  <button data-demo="branch">载入并打开游戏</button>
</div>
