<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小店动态特效储备</title><style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f5efdf;color:#44382e;font:15px/1.6 system-ui,sans-serif}header,main,footer{max-width:1250px;margin:auto;padding:26px}h1{font-size:clamp(28px,5vw,44px);line-height:1.2}p{max-width:850px;color:#7c6d5d}a{color:#40634b}.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:#e9e0ce;padding:16px;border-radius:10px}label{display:flex;gap:8px;align-items:center;font-size:13px}select,button{font:inherit;color:inherit;background:#fffaf0;border:1px solid #b4a38a;border-radius:5px;padding:8px 12px;min-height:42px;cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #718b5b;outline-offset:3px}input[type=range]{width:140px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:16px;margin-top:22px}.card{border:1px solid #d2c0a4;border-radius:9px;overflow:hidden;background:#fffaf0}.stage{display:grid;place-items:center;min-height:175px;background-color:#eee6d7;background-image:linear-gradient(45deg,#ded5c5 25%,transparent 25%),linear-gradient(-45deg,#ded5c5 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ded5c5 75%),linear-gradient(-45deg,transparent 75%,#ded5c5 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}.grid[data-background=dark] .stage{background:#29292d}.grid[data-background=light] .stage{background:#fffdf6}canvas{image-rendering:pixelated;width:128px;height:128px}.info{padding:15px}.info h2{font-size:16px;margin:0}.info p,.info code{font-size:11px;margin:5px 0;color:#7c6d5d;overflow-wrap:anywhere}.links{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0}.links a{font-size:13px}.badge{font-size:11px;border:1px solid #c1cba9;padding:2px 7px;background:#e7eddb;border-radius:10px}#status{min-height:24px;font-size:12px;color:#41634b}footer{font-size:12px;border-top:1px solid #d2c0a4}@media(max-width:520px){header,main,footer{padding:18px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.info{padding:10px}.info h2{font-size:13px}.stage{min-height:145px}}
</style></head><body><header><a href="../reserve-library/index.html">← 返回静态素材仓库</a><h1>小店动态特效储备</h1><p>蒸汽、飘叶、雨滴、清洁泡泡与互动反馈。16 种效果 × 轻柔/活跃两档 = 32 个动画片段，每段 8 帧。全部是独立透明像素素材，未安装到游戏。</p><div class="links"><a href="atlas.png" download>完整帧图集</a><a href="manifest.json" download>动画清单</a><a href="README.md">接入说明</a></div></header><main><div class="tools"><button id="play" type="button" aria-pressed="true">暂停动画</button><button id="step" type="button">逐帧 +1</button><label>帧<input id="frame" type="range" min="0" max="7" step="1" value="0"><output id="frame-label">自动</output></label><label>速度<select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label><label>背景<select id="background"><option value="checker">棋盘</option><option value="dark">深色</option><option value="light">浅色</option></select></label><label>强度<select id="strength"><option value="">全部</option><option value="gentle">轻柔</option><option value="lively">活跃</option></select></label></div><p id="status" role="status" aria-live="polite"></p><div id="grid" class="grid" data-background="checker"></div><noscript>请启用 JavaScript 预览动画，或打开 strips 目录查看水平帧条。</noscript></main><footer>循环环境效果持续播放；标记为「单次反馈」的效果在此预览中会暂停半秒再演示，但生产接入必须遵循 loop=false。默认尊重系统减少动态效果设置，可手动开始播放。只展示资源，不读取游戏存档。</footer><script src="catalog.js"></script><script>
'use strict';
const manifest=window.AMBIENT_RESERVE,$=id=>document.getElementById(id),views=[];
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)');let playing=!reduced.matches,manualFrame=0,origin=performance.now(),rafId=0;
const text=(tag,value,className)=>{const el=document.createElement(tag);el.textContent=value;if(className)el.className=className;return el;};
function frameAt(clip,elapsed,speed=1){const time=Math.max(0,elapsed)*speed,period=clip.durationMs+(clip.loop?0:500),local=time%period;return Math.min(clip.frameCount-1,Math.floor(local/1000*clip.fps));}
function updateControls(){$('play').textContent=playing?'暂停动画':'播放动画';$('play').setAttribute('aria-pressed',String(playing));$('frame-label').textContent=playing?'自动':String(manualFrame+1)+'/8';$('frame').value=String(manualFrame);requestDraw();}
function draw(now){rafId=0;for(const view of views){if(!view.ready||view.card.hidden)continue;const frame=playing?frameAt(view.clip,now-origin,Number($('speed').value)):manualFrame;view.ctx.clearRect(0,0,128,128);view.ctx.drawImage(view.image,frame*64,0,64,64,0,0,128,128);}if(playing)rafId=requestAnimationFrame(draw);}
function requestDraw(){if(!rafId)rafId=requestAnimationFrame(draw);}
if(!manifest||!Array.isArray(manifest.clips)){$('status').textContent='索引未生成，请运行 node scripts/build-ambient-reserve.mjs';$('play').disabled=true;$('step').disabled=true;}
else{
 for(const clip of manifest.clips){const card=text('article','','card'),stage=text('div','','stage'),canvas=document.createElement('canvas');canvas.width=128;canvas.height=128;canvas.setAttribute('role','img');canvas.setAttribute('aria-label',clip.nameZh);stage.append(canvas);card.append(stage);const info=text('div','','info');info.append(text('h2',clip.nameZh),text('p',clip.nameEn),text('code',clip.id),text('p','64×64 美术像素 · 8 帧 · 8 fps'));info.append(text('span',clip.loop?'循环环境效果':'单次反馈','badge'));const links=text('div','','links');for(const [label,href]of [['下载帧条',clip.strip],['首帧 PNG',clip.frames[0].path]]){const a=text('a',label);a.href=href;a.download='';links.append(a);}info.append(links);card.append(info);$('grid').append(card);const ctx=canvas.getContext('2d');if(!ctx){$('status').textContent='当前浏览器不支持 Canvas，请直接下载帧条查看。';continue;}ctx.imageSmoothingEnabled=false;const image=new Image(),view={clip,card,ctx,image,ready:false};views.push(view);image.onload=()=>{if(image.naturalWidth!==512||image.naturalHeight!==64){$('status').textContent=`帧条尺寸异常：${clip.id}`;return;}view.ready=true;requestDraw();};image.onerror=()=>{$('status').textContent=`无法读取帧条：${clip.id}`;};image.src=clip.strip;}
 $('play').addEventListener('click',()=>{playing=!playing;origin=performance.now();updateControls();});$('step').addEventListener('click',()=>{playing=false;manualFrame=(manualFrame+1)%8;updateControls();});$('frame').addEventListener('input',()=>{playing=false;manualFrame=Number($('frame').value);updateControls();});$('speed').addEventListener('change',()=>{origin=performance.now();});$('background').addEventListener('change',()=>{$('grid').dataset.background=$('background').value;});$('strength').addEventListener('change',()=>{for(const view of views)view.card.hidden=!!$('strength').value&&view.clip.strength!==$('strength').value;requestDraw();});reduced.addEventListener('change',e=>{if(e.matches){playing=false;updateControls();}});updateControls();if(reduced.matches)$('status').textContent='已按系统设置暂停自动播放；可逐帧检查或手动播放。';requestDraw();
}
</script></body></html>
