<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小店素材仓库 · Tiny Bean Café</title>
<style>
:root{color-scheme:light;--paper:#f5efdf;--panel:#fffaf0;--ink:#42382e;--muted:#837362;--sage:#41624c;--line:#d7c6ac;--amber:#ba814a}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font:15px/1.55 system-ui,sans-serif}header,main,footer{max-width:1500px;margin:auto;padding:28px}header{padding-top:42px}.eyebrow{letter-spacing:.16em;font-size:11px;color:var(--sage);font-weight:700}.title-row{display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:clamp(30px,5vw,52px);line-height:1.2;margin:12px 0}h1 span{font-weight:400;color:var(--muted)}h2{font-size:16px;margin:0}.intro{max-width:830px;color:var(--muted)}.badge{border:1px solid #b3c0a3;background:#e8eddd;color:var(--sage);padding:5px 12px;border-radius:20px;font-size:12px;white-space:nowrap}.stats{display:flex;gap:28px;flex-wrap:wrap;margin:24px 0}.stat strong{font-size:26px;margin-right:7px}.stat{color:var(--muted)}.packs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.pack{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--sage);padding:16px;border-radius:8px}.pack p{font-size:12px;color:var(--muted);margin:5px 0 10px}.pack a{font-size:12px;margin-right:12px}.filters{padding:18px;background:#eae1ce;border:1px solid var(--line);border-radius:10px;display:flex;align-items:end;gap:12px;flex-wrap:wrap}.filters label{display:grid;gap:4px;font-size:12px}input,select,button{font:inherit;color:inherit;min-height:40px;border:1px solid #baa98e;background:var(--panel);border-radius:5px;padding:8px 10px}input[type=search]{width:280px}.check{display:flex!important;align-items:center;gap:6px!important;font-size:13px!important}input[type=checkbox]{min-height:auto;accent-color:var(--sage);width:17px;height:17px;margin:0}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}button.primary{background:var(--sage);border-color:var(--sage);color:#fffaf0}button:hover:not(:disabled){filter:brightness(.94)}a{color:var(--sage)}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #8f9e53;outline-offset:3px}.toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:20px 0}.selection{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.hint{font-size:12px;color:var(--muted)}#status{min-height:24px;font-size:12px;color:var(--sage);overflow-wrap:anywhere}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;overflow:hidden}.card.chosen{outline:2px solid var(--sage);outline-offset:0}.art{min-height:208px;display:grid;place-items:center;padding:8px;background-color:#f1eadb;background-image:linear-gradient(45deg,#e4dbc9 25%,transparent 25%),linear-gradient(-45deg,#e4dbc9 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e4dbc9 75%),linear-gradient(-45deg,transparent 75%,#e4dbc9 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}.art img{image-rendering:pixelated;max-width:100%;object-fit:contain}.grid[data-background=dark] .art{background:#302d2d}.grid[data-background=light] .art{background:#fffdf6}.info{padding:13px}.info .en{font-size:11px;color:var(--muted);margin:4px 0}.id{font:10px/1.4 ui-monospace,monospace;display:block;color:var(--muted);overflow-wrap:anywhere}.tags{display:flex;gap:5px;flex-wrap:wrap;font-size:10px;margin:8px 0}.tags span{background:#e7eadc;border-radius:3px;padding:2px 5px}.actions{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}.actions button,.actions a{font-size:12px}.actions button{min-height:32px;padding:4px 8px}.card .check{margin-top:12px}.pagination{display:flex;justify-content:center;gap:18px;align-items:center;margin:24px 0}.empty{grid-column:1/-1;padding:48px;border:1px dashed var(--line);text-align:center;color:var(--muted)}footer{font-size:12px;color:var(--muted);border-top:1px solid var(--line)}@media(max-width:600px){header,main,footer{padding:18px}.title-row{display:block}h1 span{display:block;font-size:22px;margin-top:5px}.stats{gap:15px}.stat strong{font-size:23px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.art{min-height:150px}.info{padding:9px}.info h2{font-size:13px}.filters{padding:12px;gap:9px}.search{flex:1 0 100%}input[type=search]{width:100%}.packs{grid-template-columns:repeat(2,minmax(0,1fr))}.pack{padding:12px}.pack h2{font-size:14px}.pack a{display:inline-block}.actions{justify-content:start}}
</style></head>
<body>
<header><div class="eyebrow">TINY BEAN CAFÉ · ORIGINAL PIXEL RESERVE</div><div class="title-row"><h1>小店素材仓库 <span>The little things</span></h1><span class="badge">仅储备 · 未接入游戏</span></div><p class="intro">工坊的器具、街角的日常、阅读室的爱好和旅途带回的收藏。所有图片保留透明底，遵循项目暖色主色板。按需要挑选，不把整库塞进游戏。</p><div class="stats" id="stats"></div><div class="packs" id="packs"></div></header>
<main><div class="filters"><label class="search">搜索名称、标签或 ID<input id="search" type="search" placeholder="例如：相机、烘焙、shell…"></label><label>素材包<select id="pack"><option value="">所有素材包</option></select></label><label>类别<select id="category"><option value="">所有类别</option></select></label><label>变体<select id="season"><option value="">所有变体</option><option value="spring">春日</option><option value="summer">盛夏</option><option value="autumn">暖秋</option><option value="winter">冬日</option></select></label><label>背景<select id="background"><option value="checker">透明棋盘</option><option value="light">浅色</option><option value="dark">深色</option></select></label><label>倍率<select id="zoom"><option value="1">原始 1×</option><option value="2" selected>像素 2×</option></select></label><button type="button" id="reset">重置筛选</button></div>
<div class="toolbar"><div id="count" role="status" aria-live="polite"></div><div class="selection"><label class="check"><input type="checkbox" id="only-selected">只看已选</label><button type="button" id="export" class="primary" disabled>导出选中清单 (0)</button><button type="button" id="clear" disabled>清空选择</button></div></div><div id="status" role="status" aria-live="polite"></div><div id="grid" class="grid" data-background="checker"></div><div class="pagination"><button type="button" id="previous">上一页</button><span id="page" aria-live="polite"></span><button type="button" id="next">下一页</button></div><p class="hint">每页 48 张，图片按需加载。选择仅保存在当前页面内存中，关闭页面即清空，不读取或修改游戏存档。</p><noscript>请开启 JavaScript 使用画廊；各素材包目录仍可直接查看 contact-sheet.png 和 manifest.json。</noscript></main>
<footer><a href="../ambient-reserve-v1/index.html">32 个动态特效 →</a> · <a href="overview.png">精选速览图</a> · <a href="README.md">使用说明</a> · <a href="manifest.json" download>完整跨包索引</a> · <a href="verification-report.json">跨包校验报告</a><p>原创程序化绘图，非模型生图。统一目录画布不是游戏内尺寸承诺，正式接入前仍需校准比例、透视、锚点及遮挡。</p></footer>
<script src="catalog.js"></script>
<script>
'use strict';
const library=window.RESERVE_LIBRARY;
const $=id=>document.getElementById(id), selected=new Set(), PAGE_SIZE=48;
let page=0, matches=[];
const seasonNames={spring:'春日',summer:'盛夏',autumn:'暖秋',winter:'冬日'};
const legacyCategories={cafe:'饮品甜点',botanical:'花植摆件',gift:'礼盒外卖',reading:'阅读角',festival:'节庆装饰',cats:'猫咪生活'};
const text=(tag,value,className)=>{const el=document.createElement(tag);el.textContent=value;if(className)el.className=className;return el;};
const option=(select,value,label)=>{const o=text('option',label);o.value=value;select.append(o);};
const categoryName=(pack,id)=>pack.categoryLabels?.find(c=>c.id===id)?.nameZh||legacyCategories[id]||id;
function categories(){const old=$('category').value;$('category').replaceChildren();option($('category'),'','所有类别');const values=new Map();for(const p of library.packs){if($('pack').value&&p.id!==$('pack').value)continue;for(const c of p.categories)if(!values.has(c))values.set(c,categoryName(p,c));}for(const [id,label]of values)option($('category'),id,label);$('category').value=values.has(old)?old:'';}
function updateSelection(){const size=selected.size;$('export').textContent=`导出选中清单 (${size})`;$('export').disabled=!size;$('clear').disabled=!size;}
function render(reset=false){
 if(reset)page=0;
 const query=$('search').value.trim().toLocaleLowerCase();
 matches=library.sprites.filter(s=>(!$('pack').value||s.packId===$('pack').value)&&(!$('category').value||s.category===$('category').value)&&(!$('season').value||s.season===$('season').value)&&(!$('only-selected').checked||selected.has(s.id))&&(!query||[s.id,s.nameZh,s.nameEn,s.packTitleZh,...s.tags].join(' ').toLocaleLowerCase().includes(query)));
 const pages=Math.max(1,Math.ceil(matches.length/PAGE_SIZE));page=Math.min(page,pages-1);
 $('count').textContent=`${matches.length} / ${library.sprites.length} 张素材`;$('page').textContent=`第 ${page+1} / ${pages} 页`;$('previous').disabled=page===0;$('next').disabled=page>=pages-1;
 $('grid').replaceChildren();updateSelection();
 if(!matches.length){$('grid').append(text('div','没有匹配的素材。调整关键词，或重置筛选。','empty'));return;}
 const fragment=document.createDocumentFragment();
 for(const s of matches.slice(page*PAGE_SIZE,(page+1)*PAGE_SIZE)){
  const card=text('article','',`card${selected.has(s.id)?' chosen':''}`),art=text('div','','art'),img=document.createElement('img');img.src=s.path;img.alt=s.nameZh;img.loading='lazy';img.width=s.width*Number($('zoom').value);img.height=s.height*Number($('zoom').value);img.addEventListener('error',()=>{$('status').textContent='有图片读取失败，请将素材包与画廊目录放在一起，或重新运行生成命令。';});art.append(img);card.append(art);
  const info=text('div','','info');info.append(text('h2',s.nameZh),text('p',s.nameEn,'en'),text('code',s.id,'id'));
  const tags=text('div','','tags');tags.append(text('span',s.packTitleZh),text('span',seasonNames[s.season]||s.season),text('span',`${s.width}×${s.height}`));info.append(tags);
  const actions=text('div','','actions'),download=text('a','下载 PNG');download.href=s.path;download.download=s.id+'.png';const copy=text('button','复制 ID');copy.type='button';copy.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(s.id);$('status').textContent=`已复制 ${s.id}`;}catch{$('status').textContent=`请手动复制：${s.id}`;}});actions.append(download,copy);info.append(actions);
  const label=text('label','','check'),checkbox=document.createElement('input');checkbox.type='checkbox';checkbox.checked=selected.has(s.id);checkbox.setAttribute('aria-label',`选择 ${s.nameZh}`);checkbox.addEventListener('change',()=>{if(checkbox.checked)selected.add(s.id);else selected.delete(s.id);if($('only-selected').checked)render();else{card.classList.toggle('chosen',checkbox.checked);updateSelection();}});label.append(checkbox,text('span','加入待选清单'));info.append(label);card.append(info);fragment.append(card);
 }
 $('grid').append(fragment);
}
function downloadSelection(){const entries=library.sprites.filter(s=>selected.has(s.id));if(!entries.length)return;const payload={schemaVersion:1,status:'selection-only',integrated:false,baseDirectory:'assets/generated/reserve-library',note:'Paths are relative to baseDirectory. This list contains references, not PNG bytes or gameplay data.',count:entries.length,sprites:entries};const blob=new Blob([JSON.stringify(payload,null,2)+'\n'],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='tiny-bean-reserve-selection.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);$('status').textContent=`已导出 ${entries.length} 个素材引用；未修改游戏数据。`;}
if(!library||!Array.isArray(library.sprites)||!Array.isArray(library.packs)){$('count').textContent='素材库索引未生成，请运行 node scripts/build-reserve-library.mjs --gallery';$('previous').disabled=true;$('next').disabled=true;}
else{
 for(const [count,label]of [[library.counts.packs,'套素材包'],[library.counts.baseShapes,'种基础造型'],[library.counts.sprites,'张透明 PNG']]){const stat=text('div','','stat');stat.append(text('strong',String(count)),text('span',label));$('stats').append(stat);}
 for(const p of library.packs){option($('pack'),p.id,p.titleZh);const box=text('section','','pack');box.append(text('h2',p.titleZh),text('p',`${p.baseShapes} 种造型 / ${p.sprites} 张`));for(const [label,path]of [['总览',p.contactSheet],['图集',p.atlas],['索引',p.manifest]]){const a=text('a',label);a.href=path;if(label!=='总览')a.download='';box.append(a);}$('packs').append(box);}
 const initial=new URLSearchParams(window.location.search).get('pack');if(library.packs.some(p=>p.id===initial))$('pack').value=initial;categories();
 $('search').addEventListener('input',()=>render(true));$('pack').addEventListener('change',()=>{categories();render(true);});for(const id of ['category','season','only-selected'])$(id).addEventListener('change',()=>render(true));$('zoom').addEventListener('change',()=>render());$('background').addEventListener('change',()=>{$('grid').dataset.background=$('background').value;});
 $('previous').addEventListener('click',()=>{page=Math.max(0,page-1);render();});$('next').addEventListener('click',()=>{page++;render();});
 $('reset').addEventListener('click',()=>{for(const id of ['search','pack','category','season'])$(id).value='';$('only-selected').checked=false;$('background').value='checker';$('zoom').value='2';$('grid').dataset.background='checker';$('status').textContent='';categories();render(true);});
 $('clear').addEventListener('click',()=>{selected.clear();render(true);});$('export').addEventListener('click',downloadSelection);render(true);
}
</script></body></html>
