<!doctype html><meta charset="utf-8"><title>Layered pixel QA fixtures</title><style>body{font:18px system-ui;padding:24px;background:#f6eedf;color:#503a2b}button,a{display:inline-block;margin:8px;padding:14px;background:#fff;border:1px solid #bdaa8b;border-radius:12px}textarea{display:block;width:95%;height:100px}</style><h1>Synthetic QA progress, not a real player save</h1><p>This separate localhost:5313 preview installs only generated test fixtures. It never accesses port5173.</p><button id="fresh">Fresh profile</button><button id="advanced">Advanced sample</button><button id="main-art">Main art sample</button><button id="mina-seated">Mina seated sample</button><button id="server-canonical">Canonical server sample</button><button id="v12">Constructed v12</button><button id="zh">中文</button><button id="en">English</button><a href="/?qa-light=10">Open café</a><pre id="status"></pre><script>
const key='tiny-bean-cafe/save';
async function install(kind){const raw=await fetch('/qa-fixtures/'+(kind==='v12'?'advanced':kind)+'.json').then(r=>r.json());if(kind==='v12'){raw.version=12;delete raw.signatureDrinks;delete raw.regularGuests;}localStorage.setItem(key,JSON.stringify(raw));document.getElementById('status').textContent='Installed '+kind+' fixture version '+raw.version+' day '+raw.day;}
for(const kind of ['fresh','advanced','v12','main-art','mina-seated','server-canonical'])document.getElementById(kind).onclick=()=>install(kind);
document.getElementById('zh').onclick=()=>{localStorage.setItem('tiny-bean-cafe/locale','zh');document.getElementById('status').textContent='Language setting: Chinese';};document.getElementById('en').onclick=()=>{localStorage.setItem('tiny-bean-cafe/locale','en');document.getElementById('status').textContent='Language setting: English';};
</script>
